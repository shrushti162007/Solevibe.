<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLE VIBE</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font:14px Arial,sans-serif}button{cursor:pointer;border:0}header{position:sticky;top:0;z-index:9;background:#090909eF;backdrop-filter:blur(15px);border-bottom:1px solid #222;padding:16px 5%;display:flex;align-items:center;gap:25px}logo{font-size:25px;font-weight:900;letter-spacing:3px;color:#b9ff31}nav{margin-left:auto;display:flex;gap:18px}nav button,.ghost{background:none;color:#ddd;font-weight:bold}.hero{padding:70px 6%;background:radial-gradient(circle at 80%,#b9ff311c,transparent 35%)}h1{font-size:clamp(45px,9vw,90px);line-height:.9;margin:10px 0;font-weight:900}h1 span,.price{color:#b9ff31}.hero p{color:#999;max-width:550px;font-size:17px;line-height:1.6}.btn{background:#b9ff31;color:#050505;padding:14px 22px;border-radius:12px;font-weight:900;transition:.25s}.btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px #b9ff3133}.tools{padding:20px 6%;display:flex;gap:10px;flex-wrap:wrap}.tools input{flex:1;min-width:200px;background:#151515;border:1px solid #292929;color:white;padding:13px 16px;border-radius:12px}.cat{padding:11px 16px;border-radius:12px;background:#171717;color:#aaa}.cat.on,.cat:hover{background:#b9ff31;color:#050505}.grid{padding:20px 6% 60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.card{background:#111;border:1px solid #242424;border-radius:20px;overflow:hidden;transition:.3s}.card:hover{transform:translateY(-7px);border-color:#b9ff31}.pic{height:230px;background:#161616;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.heart{position:absolute;right:12px;top:12px;background:#000b;color:white;border-radius:50%;width:38px;height:38px;font-size:18px}.info{padding:18px}.info small{color:#777}.info h3{margin:7px 0;font-size:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.add{background:#b9ff31;color:#050505;padding:10px 13px;border-radius:10px;font-weight:900}.cart{position:fixed;right:0;top:0;height:100%;width:min(420px,100%);background:#0d0d0d;z-index:20;transform:translateX(100%);transition:.35s;padding:25px;overflow:auto;border-left:1px solid #333}.cart.show{transform:none}.cart h2{margin-top:5px}.close{float:right;background:#222;color:white;border-radius:10px;padding:9px 13px}.item{display:flex;gap:12px;padding:15px 0;border-bottom:1px solid #292929}.item img{width:75px;height:75px;object-fit:cover;border-radius:10px}.qty button{background:#222;color:white;padding:5px 9px;border-radius:6px}.total{font-size:20px;font-weight:bold;margin:22px 0}.modal{position:fixed;inset:0;background:#000c;z-index:30;display:none;place-items:center;padding:20px}.modal.show{display:grid}.box{background:#111;border:1px solid #333;border-radius:24px;width:min(800px,100%);max-height:90vh;overflow:auto;padding:25px}.productview{display:grid;grid-template-columns:1fr 1fr;gap:25px}.productview img{width:100%;height:330px;object-fit:cover;border-radius:18px}.sizes{margin:20px 0;padding:16px;border:1px solid #292929;border-radius:18px;background:linear-gradient(145deg,#171717,#0d0d0d)}.sizes b{display:block;color:#aaa;margin-bottom:13px;letter-spacing:1px}.sizegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.sizebtn{position:relative;padding:13px 5px;border:1px solid #333;border-radius:12px;background:#181818;color:#aaa;font-weight:900;transition:.25s;overflow:hidden}.sizebtn:hover{border-color:#b9ff31;color:white;transform:translateY(-4px);box-shadow:0 8px 20px #000}.sizebtn.on{background:#b9ff31;color:#050505;border-color:#b9ff31;transform:translateY(-4px);box-shadow:0 0 0 4px #b9ff3120,0 10px 28px #b9ff3133}.sizebtn.on:after{content:"✓";position:absolute;right:5px;top:2px;font-size:10px}.form input{width:100%;padding:13px;margin:7px 0;background:#171717;border:1px solid #333;border-radius:10px;color:white}.empty{color:#777;text-align:center;padding:35px}footer{text-align:center;padding:30px;border-top:1px solid #222;color:#666}@media(max-width:600px){header{padding:13px 4%}nav button{font-size:12px}.hero{padding:55px 5%}.grid{padding:15px 5% 50px;grid-template-columns:repeat(2,1fr);gap:12px}.pic{height:170px}.info{padding:12px}.info h3{font-size:15px}.productview{grid-template-columns:1fr}.productview img{height:250px}.sizegrid{grid-template-columns:repeat(3,1fr)}} 
</style></head><body>

<header><logo>SOLE VIBE</logo><nav><button onclick="scrollTo({top:document.querySelector('.grid').offsetTop,behavior:'smooth'})">SHOP</button><button onclick="openCart()">🛒 <span id="count">0</span></button></nav></header>

<section class="hero"><small>NEW SEASON • 2026</small><h1>MOVE<br><span>YOUR WAY.</span></h1><p>Premium footwear built for movement, street energy and everyday confidence.</p><button class="btn" onclick="scrollTo({top:document.querySelector('.grid').offsetTop,behavior:'smooth'})">SHOP COLLECTION →</button></section>

<div class="tools"><input id="search" placeholder="Search shoes..." oninput="render()"><button class="cat on" onclick="filter('All',this)">All</button><button class="cat" onclick="filter('Sneakers',this)">Sneakers</button><button class="cat" onclick="filter('Running',this)">Running</button><button class="cat" onclick="filter('Sports',this)">Sports</button><button class="cat" onclick="filter('Casual',this)">Casual</button></div>

<section class="grid" id="products"></section>

<div class="cart" id="cart"><button class="close" onclick="closeCart()">✕</button><h2>YOUR CART</h2><div id="cartitems"></div><div class="total">Total: ₹<span id="total">0</span></div><button class="btn" style="width:100%" onclick="checkout()">CHECKOUT →</button></div>

<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>

<footer>© 2026 SoleVibe · College Field Project · Designed & Developed by Shrushti Pawar</footer>

<script>
const P=[
["Air Nova X","Sneakers",3999,"https://images.unsplash.com/photo-1542291026-7eec264c27ff","Lightweight street sneaker."],
["Street Phantom","Sneakers",4499,"https://images.unsplash.com/photo-1552346154-21d32810aba3","Dark premium street style."],
["Velocity Pro","Running",4999,"https://images.unsplash.com/photo-1556906781-9a412961c28c","Fast and flexible runner."],
["Urban Pulse","Casual",3499,"https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77","Everyday urban comfort."],
["Aero Shift","Sports",5299,"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519","Performance inspired design."],
["Cloud Runner","Running",4599,"https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3","Soft cushioning for long walks."],
["Mono Edge","Sneakers",3799,"https://images.unsplash.com/photo-1608231387042-66d1773070a5","Clean monochrome finish."],
["Velocity Max","Sports",5799,"https://images.unsplash.com/photo-1460353581641-37baddab0fa2","Maximum comfort and support."],
["Retro Wave","Casual",4299,"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085","Retro inspired everyday pair."],
["Flex Runner","Running",4899,"https://images.unsplash.com/photo-1554130840-3c9a4b7f4a6d","Flexible lightweight runner."],
["Shadow Street","Sneakers",4199,"https://images.unsplash.com/photo-1607522370275-f14206abe5d3","Bold black street sneaker."],
["Gravity One","Sports",5499,"https://images.unsplash.com/photo-1551107696-a4b0c5a0d9a2","Modern performance silhouette."]
];
let C=JSON.parse(localStorage.soleCart||"[]"),F="All",wish=[];

const money=n=>n.toLocaleString("en-IN");
function filter(x,b){F=x;document.querySelectorAll(".cat").forEach(a=>a.classList.remove("on"));b.classList.add("on");render()}
function render(){
 let q=document.getElementById("search").value.toLowerCase(),a=P.filter(x=>(F=="All"||x[1]==F)&&x[0].toLowerCase().includes(q));
 document.getElementById("products").innerHTML=a.map((x,i)=>`<article class="card"><div class="pic"><img src="${x[3]}" loading="lazy"><button class="heart" onclick="event.stopPropagation();this.innerHTML=this.innerHTML=='♡'?'♥':'♡'">♡</button></div><div class="info"><small>${x[1]}</small><h3>${x[0]}</h3><div class="row"><b class="price">₹${money(x[2])}</b><button class="add" onclick="quick(${P.indexOf(x)})">VIEW</button></div></div></article>`).join("")
}
function quick(i){
 let p=P[i],s="7";
 modal.innerHTML=`<div class="box"><button class="close" onclick="closeModal()">✕</button><div class="productview"><img src="${p[3]}"><div><small>${p[1]}</small><h2>${p[0]}</h2><h2 class="price">₹${money(p[2])}</h2><p style="color:#999;line-height:1.6">${p[4]}</p><div class="sizes"><b>SELECT SIZE • EU / IN</b><div class="sizegrid">${[6,7,8,9,10,11].map(n=>`<button class="sizebtn ${n==7?"on":""}" onclick="sel(this,${n})">${n}</button>`).join("")}</div></div><button class="btn" style="width:100%" onclick="add(${i},s);closeModal()">ADD TO CART • SIZE <span id="sz">7</span></button></div></div></div>`;
 modal.classList.add("show")
}
function sel(b,n){document.querySelectorAll(".sizebtn").forEach(x=>x.classList.remove("on"));b.classList.add("on");s=n;document.getElementById("sz").textContent=n}
let s=7;
function add(i,size){let z=C.find(x=>x.i==i&&x.s==size);z?z.q++:C.push({i,s:size,q:1});save();openCart();flash()}
function flash(){let e=document.querySelector("#count");e.animate([{transform:"scale(1)"},{transform:"scale(1.7)"},{transform:"scale(1)"}],{duration:450})}
function save(){localStorage.soleCart=JSON.stringify(C);draw()}
function draw(){
 let n=C.reduce((a,x)=>a+x.q,0),t=C.reduce((a,x)=>a+P[x.i][2]*x.q,0);count.textContent=n;total.textContent=money(t);
 cartitems.innerHTML=C.length?C.map((x,j)=>{let p=P[x.i];return`<div class="item"><img src="${p[3]}"><div style="flex:1"><b>${p[0]}</b><small style="display:block;color:#888">Size ${x.s} • ₹${money(p[2])} each</small><b class="price">₹${money(p[2]*x.q)}</b><div class="qty"><button onclick="qty(${j},-1)">−</button> ${x.q} <button onclick="qty(${j},1)">+</button></div></div></div>`}).join(""):`<div class="empty">Your cart is empty 🛒</div>`
}
function qty(j,d){C[j].q+=d;if(C[j].q<1)C.splice(j,1);save()}
function openCart(){cart.classList.add("show");draw()}function closeCart(){cart.classList.remove("show")}
function closeModal(){modal.classList.remove("show")}
function checkout(){
 if(!C.length)return alert("Your cart is empty!");
 modal.innerHTML=`<div class="box"><button class="close" onclick="closeModal()">✕</button><h2>CHECKOUT</h2><div style="margin:20px 0">${C.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #292929">${P[x.i][0]} × ${x.q} • Size ${x.s} • ₹${money(P[x.i][2]*x.q)}</div>`).join("")}</div><div class="total">Total: ₹${money(C.reduce((a,x)=>a+P[x.i][2]*x.q,0))}</div><div class="form"><input id="name" placeholder="Full name"><input id="phone" placeholder="Phone number"><input id="address" placeholder="Delivery address"></div><button class="btn" style="width:100%;margin-top:12px" onclick="place()">PLACE ORDER</button></div>`;
 closeCart();modal.classList.add("show")
}
function place(){
 if(!name.value.trim()||phone.value.trim().length<10||!address.value.trim())return alert("Please enter valid name, 10-digit phone and address.");
 modal.innerHTML=`<div class="box" style="text-align:center;padding:50px 25px"><div style="font-size:60px">✓</div><h1 style="font-size:45px">ORDER<br><span>PLACED!</span></h1><p style="color:#999">Thank you for shopping with SoleVibe.</p><button class="btn" onclick="C=[];save();closeModal();render()">CONTINUE SHOPPING</button></div>`;
 C=[];save()
}
render();draw();
</script></body></html>
